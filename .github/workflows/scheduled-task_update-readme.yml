name: Update README
on:
  workflow_dispatch:
  schedule:
    - cron: 30 15 * * 0
jobs:
  update-readme:
    uses: serversideup/.github/.github/workflows/update-readme.yml@master
    # main requires PRs with passing checks, so README updates arrive as an auto-merging PR
    with:
      commit_mode: pull-request
    secrets:
      pr_token: ${{ secrets.WORKFLOW_PAT }}
    permissions:
      contents: write
